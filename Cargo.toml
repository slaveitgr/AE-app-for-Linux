[workspace]
resolver = "2"
members = [
    "aeapp-bootstrap",
    "aeapp-cli",
    "aeapp-lib",
    "aeapp-service",
    "aeapp-tui",
    "aeapp-ui",
    "aeapp-resources",
]

[profile.release]
strip = true

[patch.crates-io]
flate2 = { git = 'https://github.com/ArmchairDevelopers/flate2-rs.git' }
async-compression = { git = 'https://github.com/ArmchairDevelopers/async-compression.git' }
